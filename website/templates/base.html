<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{{ config.description }}">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="/" class="site-title">Sonic Eddy</a>
      <ul>
        {% for item in config.extra.nav %}
        <li><a href="{{ item.url }}"{% if current_path and current_path is starting_with(pat=item.url) %} class="active"{% endif %}>{{ item.name }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>Sonic Eddy &mdash; <a href="https://git.sr.ht/~frank6/sonic-eddy">Source</a></p>
  </footer>
  <script>
    document.querySelectorAll('blockquote > p:first-child').forEach(p => {
      const m = p.textContent.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i);
      if (!m) return;
      const kind = m[1].toLowerCase();
      const bq = p.parentElement;
      bq.classList.add('markdown-alert', `markdown-alert-${kind}`);
      const title = document.createElement('p');
      title.className = 'markdown-alert-title';
      title.textContent = m[1].charAt(0) + m[1].slice(1).toLowerCase();
      p.textContent = p.textContent.slice(m[0].length);
      bq.insertBefore(title, p);
      if (!p.textContent.trim()) p.remove();
    });
  </script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });
    document.querySelectorAll('pre > code[data-lang="mermaid"]').forEach(el => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = el.textContent;
      el.parentElement.replaceWith(div);
    });
    mermaid.run();
  </script>
</body>
</html>
